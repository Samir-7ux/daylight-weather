name: Build mobile apps

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        options:
          - all
          - android
          - ios
        default: all
        required: true

permissions:
  contents: read

jobs:
  android:
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies and generate Android project
        run: |
          npm install --no-audit --no-fund
          npm run build:web
          npx cap add android
          npx cap sync android
          npx @capacitor/assets generate --android --iconBackgroundColor '#178f83' --splashBackgroundColor '#f3f6f7'
      - name: Build Android APK and App Bundle
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: daylight-weather-android-unsigned
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and generate iOS project
        run: |
          npm install --no-audit --no-fund
          npm run build:web
          npx cap add ios
          npx cap sync ios
          npx @capacitor/assets generate --ios --iconBackgroundColor '#178f83' --splashBackgroundColor '#f3f6f7'
      - name: Build unsigned iOS archive
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DaylightWeather.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/DaylightWeather.xcarchive" \
            "$RUNNER_TEMP/DaylightWeather-iOS-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: daylight-weather-ios-unsigned
          path: ${{ runner.temp }}/DaylightWeather-iOS-unsigned.zip
          if-no-files-found: error
          retention-days: 14
